[tasks.ci]
description = "Run local CI commands"
run = [
  "cargo test --workspace",
  "cargo clippy --all-targets --all-features",
  "cargo fmt -- --check",
  "mise rustdoc",
  "mise schema --check",
]

[tasks.cli]
description = "Run a CLI command"
quiet = true
run = "cargo run --package slumber_cli --no-default-features"

[tasks.docs]
description = "Build and serve docs"
run = "mdbook serve docs/"

[tasks.favicon]
description = "Generate favicon for the site from the logo image"
run = "magick -background transparent $MISE_PROJECT_ROOT/static/slumber.png -define icon:auto-resize=64 $MISE_PROJECT_ROOT/docs/theme/favicon.png"
sources = ["docs/theme/favicon.png"]

[tasks.mock]
description = "Run the mock server and watch for changes"
raw_args = true
run = """
watchexec --on-busy-update=restart --shell=none --wrap-process=none \
  --watch=Cargo.toml --watch=Cargo.lock --watch=crates/ \
  -- cargo run --package slumber_mock --
"""

[tasks.rustdoc]
description = "Build Rust docs, checking for broken links"
env.RUSTDOCFLAGS = "-D warnings"
run = "cargo doc --no-deps --all-features --document-private-items --workspace"

[tools]
"cargo:samply" = "latest"
"github:rust-lang/mdbook" = "0.5.1" # mdbook tool doesn't support aarch64/linux
watchexec = "2.3.3"
