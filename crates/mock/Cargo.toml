[package]
authors = {workspace = true}
description = "An HTTP server that serves responses from Slumber's request history database"
edition = {workspace = true}
homepage = {workspace = true}
keywords = {workspace = true}
license = {workspace = true}
name = "slumber_mock"
publish = false
repository = {workspace = true}
rust-version = {workspace = true}
version = "0.1.2"

[[bin]]
name = "slumber-mock" # I don't like underscores in command names
path = "src/main.rs"

[dependencies]
anyhow = {workspace = true}
axum = {version = "0.8.9", default-features = false, features = ["http1", "tokio"]}
clap = {workspace = true, features = ["derive"]}
itertools = {workspace = true}
reqwest = {workspace = true}
slumber_core = {workspace = true}
tokio = {workspace = true, features = ["rt", "macros"]}
tower-http = {version = "0.7.1", default-features = false, features = ["trace"]}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["ansi", "registry"]}
url = {workspace = true}

[lints]
workspace = true

[package.metadata.release]
tag = false
